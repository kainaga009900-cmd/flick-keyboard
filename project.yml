name: FlickKeyboard
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "${BUILD_NUMBER}"
    DEVELOPMENT_TEAM: "${APPLE_TEAM_ID}"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
packages:
  AzooKeyKanaKanjiConverter:
    url: https://github.com/azooKey/AzooKeyKanaKanjiConverter
    minorVersion: 0.11.2
  KeyboardCore:
    path: KeyboardCore
targets:
  FlickKeyboard:
    type: application
    platform: iOS
    sources:
      - path: App
    info:
      path: Support/App-Info.plist
      properties:
        CFBundleDisplayName: 変換キーボード
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.kainaga009900-cmd.flickkeyboard
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: KeyboardExtension
  KeyboardExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: Keyboard
      - path: Vendor/azooKey_dictionary_storage/Dictionary
        type: folder
        buildPhase: resources
    info:
      path: Support/Keyboard-Info.plist
      properties:
        CFBundleDisplayName: 変換キーボード
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).KeyboardViewController"
          NSExtensionAttributes:
            IsASCIICapable: false
            PrefersRightToLeft: false
            PrimaryLanguage: ja-JP
            RequestsOpenAccess: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.kainaga009900-cmd.flickkeyboard.keyboard
        APPLICATION_EXTENSION_API_ONLY: YES
    dependencies:
      - package: AzooKeyKanaKanjiConverter
        product: KanaKanjiConverterModule
      - package: KeyboardCore
        product: KeyboardCore
schemes:
  FlickKeyboard:
    build:
      targets:
        FlickKeyboard: all
    archive:
      config: Release
